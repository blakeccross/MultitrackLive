name: Validate release secrets

# Checks that macOS release secrets are present and usable.
# Does NOT archive, notarize an app, or create a GitHub Release.
#
# Run: Actions → Validate release secrets → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check secrets are non-empty
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            SPARKLE_PRIVATE_KEY
          do
            # Indirect expansion without printing values
            eval "value=\${$name-}"
            if [[ -z "$value" ]]; then
              echo "❌ $name is empty / not set"
              missing=1
            else
              echo "✅ $name is set (${#value} chars)"
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/validate-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo "Decoded .p12 size: $(wc -c < "$CERTIFICATE_PATH") bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Certificates in CI keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "❌ No 'Developer ID Application' identity found after import"
            echo "   Check BUILD_CERTIFICATE_BASE64 (use: base64 -i Cert.p12 | tr -d '\\n' | pbcopy)"
            echo "   and that P12_PASSWORD matches the export password"
            exit 1
          fi
          echo "✅ Developer ID Application certificate imported"

      - name: Authenticate with notarytool (API key)
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          # history succeeds only when Key ID / Issuer / .p8 are valid together
          xcrun notarytool history \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            >/dev/null

          echo "✅ App Store Connect API key authenticates with notarytool"

      - name: Check Sparkle private key format
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Strip accidental whitespace/newlines from paste
          KEY="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]')"
          echo "Key length after trim: ${#KEY}"

          if [[ ${#KEY} -lt 40 || ${#KEY} -gt 128 ]]; then
            echo "❌ SPARKLE_PRIVATE_KEY length looks wrong (expected ~44 chars for modern EdDSA seed)"
            exit 1
          fi

          # Confirm it base64-decodes to 32 bytes (Ed25519 seed) or is an older longer format
          DECODED_LEN="$(printf '%s' "$KEY" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')"
          echo "Decoded byte length: $DECODED_LEN"

          if [[ "$DECODED_LEN" != "32" && "$DECODED_LEN" != "64" ]]; then
            echo "❌ Decoded key should be 32 bytes (new) or 64 bytes (legacy). Got $DECODED_LEN"
            echo "   Re-export with: generate_keys -x sparkle_private.key"
            echo "   Then: pbcopy < sparkle_private.key"
            exit 1
          fi

          # Optional: verify against public key embedded in the app Info.plist once checked out
          echo "✅ SPARKLE_PRIVATE_KEY looks like a valid EdDSA key blob"

      - name: Checkout (for public key cross-check)
        uses: actions/checkout@v4

      - name: Cross-check Sparkle public key in Info.plist
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          EXPECTED="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' MultitrackLive/Info.plist)"
          echo "Info.plist SUPublicEDKey: $EXPECTED"

          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"

          printf '%s' "$(printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]')" > "$RUNNER_TEMP/sparkle_ed_key"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_key"

          # sign a tiny file; if key is corrupt, sign_update fails
          echo "sparkle-secret-check" > "$RUNNER_TEMP/probe.txt"
          "$RUNNER_TEMP/bin/sign_update" -p --ed-key-file "$RUNNER_TEMP/sparkle_ed_key" "$RUNNER_TEMP/probe.txt" >/dev/null

          echo "✅ SPARKLE_PRIVATE_KEY works with sign_update"
          echo "✅ Expected app public key is: $EXPECTED"
          echo "   (Installs must have been built with this same SUPublicEDKey)"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/validate-signing.keychain-db" || true
